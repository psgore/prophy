<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2nd PU</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="stylesheet" href="../css/main.css">
</head>

<body>
  <header>
    <div id="header"></div>
    <script>
      fetch('../header.html')
        .then(response => response.text())
        .then(data => document.getElementById('header').innerHTML = data);
    </script>
  </header>

  <section class="section">
    <div class="container container-narrow">
      <div class="section-header animate-on-scroll">
        <h2>2nd PU Physics</h2>
        <p>Select what you need — notes or question papers.</p>
      </div>

      <div class="card-grid grid-2col">
        <a href="pu2-notes.html" class="nav-card card-interactive animate-on-scroll delay-1">
          <div class="nav-card-icon card-icon-blue">&#x1F4D6;</div>
          <h3>Notes</h3>
          <p>All chapters with PDF links</p>
        </a>
        <a href="pu2-question-papers.html" class="nav-card card-interactive animate-on-scroll delay-2">
          <div class="nav-card-icon card-icon-green">&#x1F4C4;</div>
          <h3>Question Papers</h3>
          <p>Model question papers</p>
        </a>
      </div>

      <div class="text-center mt-4 animate-on-scroll delay-3">
        <a href="board-notes.html" class="back-btn">&larr; Back to Board Notes</a>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2024-2026 ProPhy. All rights reserved.</p>
    </div>
  </footer>

  <button class="scroll-top" aria-label="Scroll to top"><svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg></button>
  <script src="../js/main.js"></script>

</html>
